services:
  router:
    build: .
    container_name: llm-router
    ports:
      - "3002:3000"
    environment:
      - MERGE_API_KEY=${MERGE_API_KEY}
      - BIND_HOST=0.0.0.0
      - PORT=3000
      - CATALOG_DIR=/app/catalog
      - LOG_LEVEL=info
    volumes:
      - ./catalog:/app/catalog
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
